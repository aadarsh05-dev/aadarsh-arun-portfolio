<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" font-family="system-ui,Segoe UI,Helvetica,Arial,sans-serif">
  <text x="10" y="18" font-size="13" font-weight="600" fill="#666666">Rubric agreement with human labels, by iteration</text>

  <line x1="50" y1="30" x2="450" y2="30" stroke="#666666" stroke-opacity="0.18"/>
  <text x="44" y="34" font-size="10" text-anchor="end" fill="#666666">100%</text>
  <line x1="50" y1="67.5" x2="450" y2="67.5" stroke="#666666" stroke-opacity="0.18"/>
  <text x="44" y="71.5" font-size="10" text-anchor="end" fill="#666666">75%</text>
  <line x1="50" y1="105" x2="450" y2="105" stroke="#666666" stroke-opacity="0.18"/>
  <text x="44" y="109" font-size="10" text-anchor="end" fill="#666666">50%</text>
  <line x1="50" y1="142.5" x2="450" y2="142.5" stroke="#666666" stroke-opacity="0.18"/>
  <text x="44" y="146.5" font-size="10" text-anchor="end" fill="#666666">25%</text>
  <line x1="50" y1="180" x2="450" y2="180" stroke="#666666" stroke-opacity="0.4"/>
